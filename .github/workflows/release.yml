name: Release formula

on:
  push:
    tags: ['v*']

permissions:
  contents: read
  id-token: write

jobs:
  build-and-release:
    runs-on: macos-13
    steps:
      - uses: actions/checkout@v4
        with:
          repository: azatisakov/FinderCTL
          ref: ${{ github.ref }}

      - name: Install uv
        uses: egor-tensin/setup-uv@v1
        with:
          version: latest

      - name: Build sdist
        run: |
          uv sync
          uv build --sdist

      - name: Compute SHA256
        id: sha
        run: |
          export SHA=$(shasum -a 256 dist/*.tar.gz | awk '{print $1}')
          echo "sha=$SHA" >> $GITHUB_OUTPUT
          echo "Release SHA: $SHA"

      - name: Get dependency SHAs
        id: deps
        run: |
          echo "Getting SHAs from PyPI..."
          for pkg in typer ds-store click shellingham; do
            URL=$(python3 -c "import json,urllib.request; d=json.load(urllib.request.urlopen('https://pypi.org/pypi/$pkg/json')); v=d['info']['version']; urls=[f['url'] for f in d['releases'][v] if f['packagetype']=='sdist']; print(urls[0])")
            SHA=$(python3 -c "import json,urllib.request; d=json.load(urllib.request.urlopen('https://pypi.org/pypi/$pkg/json')); v=d['info']['version']; shas=[f['digests']['sha256'] for f in d['releases'][v] if f['packagetype']=='sdist']; print(shas[0])")
            echo "${pkg}_url=${URL}" >> $GITHUB_OUTPUT
            echo "${pkg}_sha=${SHA}" >> $GITHUB_OUTPUT
            echo "$pkg: $SHA"
          done

      - name: Clone tap repo
        run: |
          cd /tmp
          git clone --depth 1 https://github.com/azatisakov/homebrew-finderctl.git
          cd homebrew-finderctl

      - name: Update formula
        run: |
          cd /tmp/homebrew-finderctl
          VERSION=${GITHUB_REF#refs/tags/}

          cat > Formula/FinderCTL.rb << 'FORMULA'
class Finderctl < Formula
  desc "Manage macOS Finder preferences safely"
  homepage "https://github.com/azatisakov/FinderCTL"
  url "https://github.com/azatisakov/FinderCTL/archive/${VERSION}.tar.gz"
  sha256 "${{ steps.sha.outputs.sha }}"
  license "MIT"

  depends_on "python@3.13"

  resource "typer" do
    url "${{ steps.deps.outputs.typer_url }}"
    sha256 "${{ steps.deps.outputs.typer_sha }}"
  end

  resource "ds-store" do
    url "${{ steps.deps.outputs.ds-store_url }}"
    sha256 "${{ steps.deps.outputs.ds-store_sha }}"
  end

  resource "click" do
    url "${{ steps.deps.outputs.click_url }}"
    sha256 "${{ steps.deps.outputs.click_sha }}"
  end

  resource "shellingham" do
    url "${{ steps.deps.outputs.shellingham_url }}"
    sha256 "${{ steps.deps.outputs.shellingham_sha }}"
  end

  def install
    venv = libexec
    system "python3.13", "-m", "venv", "--without-pip", venv
    venv_bin = venv/"bin"
    pip = venv_bin/"pip"

    system venv_bin/"python3", "-m", "ensurepip", "--default-pip"

    resources.each do |r|
      system pip, "install", "--no-deps", r.name, r.cached_download
    end

    system pip, "install", "--no-deps", buildpath

    (bin/"finderctl").unlink if (bin/"finderctl").exist?
    bin.mkpath
    ln_s venv_bin/"finderctl", bin/"finderctl"
  end

  test do
    assert_match "FinderCTL", shell_output("#{bin}/finderctl --version 2>&1")
  end
end
FORMULA

      - name: Brew audit
        run: |
          cd /tmp/homebrew-finderctl
          brew audit --strict --new Formula/FinderCTL.rb

      - name: Push to tap
        run: |
          cd /tmp/homebrew-finderctl
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add Formula/FinderCTL.rb
          git commit -m "Update formula to ${VERSION}" || exit 0
          git push origin main

  test-install:
    needs: build-and-release
    runs-on: macos-13
    steps:
      - uses: actions/checkout@v4

      - name: Install and test
        run: |
          brew tap azatisakov/finderctl
          HOMEBREW_BUILD_FROM_SOURCE=1 brew install finderctl
          finderctl --version
