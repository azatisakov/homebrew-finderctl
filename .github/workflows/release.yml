name: Release formula

on:
  push:
    tags: ['v*']

permissions:
  contents: read
  id-token: write

jobs:
  build-and-release:
    runs-on: macos-13
    steps:
      - uses: actions/checkout@v4
        with:
          repository: azatisakov/FinderCTL
          ref: ${{ github.ref }}

      - name: Install uv
        uses: egor-tensin/setup-uv@v1
        with:
          version: latest

      - name: Build sdist
        run: |
          uv sync
          uv build --sdist

      - name: Compute SHA256
        id: sha
        run: |
          export SHA=$(shasum -a 256 dist/*.tar.gz | awk '{print $1}')
          echo "sha=$SHA" >> $GITHUB_OUTPUT
          echo "Release SHA: $SHA"

      - name: Clone tap repo
        run: |
          cd /tmp
          git clone --depth 1 https://github.com/azatisakov/homebrew-finderctl.git
          cd homebrew-finderctl

      - name: Update formula
        run: |
          cd /tmp/homebrew-finderctl
          VERSION=${GITHUB_REF#refs/tags/}

          cat > Formula/FinderCTL.rb << 'FORMULA'
class Finderctl < Formula
  include Language::Python::Virtualenv

  desc "Manage macOS Finder preferences safely"
  homepage "https://github.com/azatisakov/FinderCTL"
  url "https://github.com/azatisakov/FinderCTL/archive/${VERSION}.tar.gz"
  sha256 "${{ steps.sha.outputs.sha }}"
  license "MIT"

  depends_on "python@3.13"

  def install
    venv = virtualenv_create(libexec)
    venv.pip_install_and_link "typer>=0.12", "ds-store>=1.3", "click>=8.2.1", "shellingham>=1.5.4"

    venv.pip_install_and_link path

    (bin/"finderctl").unlink if (bin/"finderctl").exist?
    ln_s venv.bin/"finderctl", bin/"finderctl"
  end

  test do
    assert_match "FinderCTL", shell_output("#{bin}/finderctl --version 2>&1")
  end
end
FORMULA

      - name: Brew audit
        run: |
          cd /tmp/homebrew-finderctl
          brew audit --strict --new Formula/FinderCTL.rb

      - name: Push to tap
        run: |
          cd /tmp/homebrew-finderctl
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add Formula/FinderCTL.rb
          git commit -m "Update formula to ${VERSION}" || exit 0
          git push origin main

  test-install:
    needs: build-and-release
    runs-on: macos-13
    steps:
      - uses: actions/checkout@v4

      - name: Install and test
        run: |
          brew tap azatisakov/finderctl
          HOMEBREW_BUILD_FROM_SOURCE=1 brew install finderctl
          finderctl --version
